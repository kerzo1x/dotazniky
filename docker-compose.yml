services:
  db:
    image: postgres:18-alpine  
    container_name: dotazniky_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dotazniky_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always 

volumes:
  postgres_data: